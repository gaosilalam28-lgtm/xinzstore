body:before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.24));
}
/* large storefront glow / display area */
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 45%,rgba(3,4,10,.28) 100%);
}
.container{
  width:min(100%,520px);padding:48px 18px 30px;
  position:relative;z-index:1;
}

.profile{text-align:center}
.logo{
  width:92px;height:92px;border-radius:50%;margin:auto;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#fff,#d18aff 48%,#6a249d);
  color:#111;font-size:25px;font-weight:900;
  border:3px solid rgba(255,255,255,.92);
  box-shadow:0 0 25px rgba(194,105,255,.62),0 0 75px rgba(137,48,255,.24);
}
h1{
  font-size:25px;margin:15px 0 5px;letter-spacing:.5px;
  text-shadow:0 0 22px rgba(203,119,255,.48);
}
.bio{margin:0 auto 25px;color:#c9c6d4;font-size:14px}
.links{display:flex;flex-direction:column;gap:14px}
a{
  text-decoration:none;color:#fff;
  background:
    linear-gradient(100deg,rgba(255,255,255,.12),rgba(125,61,157,.09) 52%,rgba(255,255,255,.055));
  border:1px solid rgba(255,255,255,.18);
  min-height:62px;padding:0 20px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;position:relative;overflow:hidden;
  backdrop-filter:blur(15px);
  box-shadow:0 14px 35px rgba(0,0,0,.30),inset 0 1px rgba(255,255,255,.08);
  transition:.2s transform,.2s background,.2s box-shadow;
}
a:before{
  content:"";position:absolute;inset:0;border-radius:18px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
  transform:translateX(-100%);transition:.55s;
}
a:hover{transform:translateY(-2px);background:rgba(255,255,255,.14);box-shadow:0 16px 38px rgba(0,0,0,.35)}
a:hover:before{transform:translateX(100%)}
a .icon{position:absolute;left:19px;font-size:22px}
.footer{text-align:center;color:#777384;font-size:12px;margin-top:28px}

.logo img{
  width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;
}
</style>
